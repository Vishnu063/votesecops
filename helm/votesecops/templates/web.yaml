{{- range $name := list "vote" "result" }}
{{- $c := index $.Values $name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ $name }}}
  template:
    metadata:
      labels: {app: {{ $name }}}
    spec:
      containers:
      - name: {{ $name }}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
        image: {{ $c.image }}:{{ $c.tag }}
        imagePullPolicy: IfNotPresent
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 20, periodSeconds: 20}
        securityContext: {allowPrivilegeEscalation: false, seccompProfile: {type: RuntimeDefault}}
        readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 20, periodSeconds: 20}
        securityContext: {allowPrivilegeEscalation: false, seccompProfile: {type: RuntimeDefault}}
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: NodePort
  selector: {app: {{ $name }}}
  ports:
  - port: 80
    targetPort: 80
    nodePort: {{ $c.nodePort }}
{{- end }}
