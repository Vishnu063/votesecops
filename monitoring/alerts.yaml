apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: votesecops-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: votesecops
    rules:
    - alert: PodRestartingOften
      expr: increase(kube_pod_container_status_restarts_total{namespace="vote"}[10m]) > 2
      for: 1m
      labels: {severity: warning}
      annotations:
        summary: "Pod {{ $labels.pod }} restarted more than 2 times in 10 minutes"
    - alert: VotePodDown
      expr: kube_deployment_status_replicas_available{namespace="vote"} < 1
      for: 1m
      labels: {severity: critical}
      annotations:
        summary: "Deployment {{ $labels.deployment }} has no available pods"
